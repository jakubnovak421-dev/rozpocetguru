plugins {
    id 'com.android.application'
}

android {
    namespace 'sk.rozpocetguru.app'
    compileSdk 35

    defaultConfig {
        applicationId "sk.rozpocetguru.app"
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
